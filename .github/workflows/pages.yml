name: Publier les applications (GitHub Pages)

# Publie sur GitHub Pages :
#   /                     -> page d'accueil (lanceur des applications)
#   /gestion-commandes/   -> application Gestion des Commandes
#   /basicfit-coach/      -> application Coach Basic Fit
# Chaque application reste installable (PWA) et utilisable hors ligne.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "gestion-commandes/**"
      - "basicfit-coach/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        run: |
          mkdir -p _site
          # Page d'accueil (lanceur)
          cp index.html _site/index.html
          # Applications installables
          mkdir -p _site/gestion-commandes _site/basicfit-coach
          cp -r gestion-commandes/. _site/gestion-commandes/
          cp -r basicfit-coach/. _site/basicfit-coach/
          touch _site/.nojekyll

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
