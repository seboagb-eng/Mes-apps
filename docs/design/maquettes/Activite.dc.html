<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PILOT — Activité</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D2A9E}a:hover{color:#1E1B73}
input::placeholder{color:#8A8F99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3F4F1; font-family: Manrope, system-ui, sans-serif; color: #10131A; display: flex; flex-direction: column">

  <div style="padding: 20px 18px 12px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">Activité</h1>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #D5D7D1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#565B66" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher</span>
      <input type="search" placeholder="Client, montant, catégorie" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 500 15px Manrope, sans-serif; color: #10131A">
    </label>
    <div role="tablist" aria-label="Filtrer" style="display: flex; gap: 6px; overflow-x: auto">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{f.checked}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="margin: 0 18px 12px; background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; color: #565B66">Entrées cette semaine</span>
      <b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; color: #0F7A4A; font-variant-numeric: tabular-nums">+ 845 000</b>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; color: #565B66">Sorties cette semaine</span>
      <b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-variant-numeric: tabular-nums">− 312 000</b>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #565B66">{{d.label}}</h2>
        <div style="background: #FFFFFF; border-radius: 16px; padding: 4px 12px; display: flex; flex-direction: column">
          <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
            <div style="{{r.rowStyle}}">
              <span style="{{r.iconStyle}}">{{r.sign}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <b style="font-size: 15px">{{r.title}}</b>
                <span style="font-size: 13px; color: #565B66">{{r.sub}}</span>
              </span>
              <b style="{{r.amountStyle}}">{{r.amount}}</b>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Navigation" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E3DE; padding: 6px 6px 14px">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 700; color: #565B66; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Accueil</a>
    <a href="Activite.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 800; color: #2D2A9E; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l5-6 4 4 7-9"></path></svg>Activité</a>
    <a href="Recouvrement.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 700; color: #565B66; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"></path></svg>Relances</a>
    <a href="Compte.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 700; color: #565B66; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Compte</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'Tout' };
  }
  renderVals() {
    const data = [
      { label: "Aujourd'hui", rows: [
        { k: 'Ventes', title: 'Vente comptoir', sub: '10 h 12 · MoMo', amount: '+ 25 000' },
        { k: 'Ventes', title: 'M. Hounkpè', sub: '11 h 42 · Paiement relance · MoMo', amount: '+ 185 000' },
        { k: 'Dépenses', title: 'Transport', sub: '12 h 05 · Caisse', amount: '− 15 000' }
      ]},
      { label: 'Hier', rows: [
        { k: 'Crédits', title: 'Hôtel du Lac', sub: 'Vente à crédit · échéance 3 nov.', amount: '520 000' },
        { k: 'Ventes', title: 'Vente comptoir', sub: '16 h 30 · Espèces', amount: '+ 60 000' },
        { k: 'Dépenses', title: 'Stock', sub: '09 h 15 · Banque · reçu joint', amount: '− 240 000' }
      ]},
      { label: 'Lundi 2 novembre', rows: [
        { k: 'Ventes', title: 'Boutique Sènan', sub: 'Acompte · Moov', amount: '+ 75 000' },
        { k: 'Dépenses', title: 'Crédit tél.', sub: 'Caisse', amount: '− 5 000' }
      ]}
    ];
    const kinds = {
      Ventes: { sign: '+', bg: '#E3F4E8', fg: '#0F7A4A', amt: '#0F7A4A' },
      Dépenses: { sign: '−', bg: '#ECEDE9', fg: '#10131A', amt: '#10131A' },
      Crédits: { sign: '⏱', bg: '#FFE8DA', fg: '#8F3708', amt: '#8F3708' }
    };
    const f = this.state.f;
    const days = data.map((d) => ({
      label: d.label,
      rows: d.rows.filter((r) => f === 'Tout' || r.k === f).map((r, i) => {
        const k = kinds[r.k];
        return {
          ...r,
          sign: k.sign,
          rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 60px; ' + (i > 0 ? 'border-top: 1px solid #ECEDE9;' : ''),
          iconStyle: 'width: 36px; height: 36px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; background: ' + k.bg + '; color: ' + k.fg,
          amountStyle: 'font-size: 15px; font-variant-numeric: tabular-nums; color: ' + k.amt
        };
      })
    })).filter((d) => d.rows.length > 0);
    const filters = ['Tout', 'Ventes', 'Dépenses', 'Crédits'].map((x) => {
      const on = f === x;
      return {
        label: x,
        checked: on ? 'true' : 'false',
        style: 'flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; font: 800 14px Manrope, sans-serif; cursor: pointer; ' + (on ? 'background: #10131A; color: #FFFFFF; border: 1.5px solid #10131A;' : 'background: #FFFFFF; color: #10131A; border: 1.5px solid #D5D7D1;'),
        pick: () => this.setState({ f: x })
      };
    });
    return { days, filters };
  }
}
</script>
</body>
</html>
