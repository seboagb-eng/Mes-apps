<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PILOT — Recouvrement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D2A9E}a:hover{color:#1E1B73}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3F4F1; font-family: Manrope, system-ui, sans-serif; color: #10131A; display: flex; flex-direction: column">

  <div style="padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Accueil.dc.html" aria-label="Retour à l'accueil" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #10131A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Relances</h1>
    </div>
    <div style="background: #10131A; color: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 600; color: #D4D5DA">Argent dehors</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">1 240 000 <span style="font-size: 14px">FCFA</span></span>
      </div>
      <span style="font-size: 13px; font-weight: 700; color: #FFB48A; text-align: right">385 000<br>en retard</span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 16px; display: flex; flex-direction: column; gap: 16px">
    <div role="radiogroup" aria-label="Client à relancer" style="background: #FFFFFF; border-radius: 20px; padding: 6px; display: flex; flex-direction: column">
      <sc-for list="{{clients}}" as="c" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="{{c.style}}">
          <span style="{{c.badge}}">{{c.initials}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0">
            <b style="font-size: 15px">{{c.name}}</b>
            <span style="{{c.lateStyle}}">{{c.late}}</span>
          </span>
          <b style="font-size: 15px; font-variant-numeric: tabular-nums">{{c.amount}}</b>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="ton" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #565B66">Ton du message</span>
      <div role="radiogroup" aria-labelledby="ton" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #E2E3DE; padding: 4px; border-radius: 14px">
        <sc-for list="{{tones}}" as="t" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="background: #EAE6DF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; color: #565B66">Aperçu WhatsApp</span>
      <div style="align-self: flex-end; max-width: 92%; background: #D9FDD3; border-radius: 14px 14px 4px 14px; padding: 10px 12px; font-size: 14px; line-height: 1.45; color: #10131A; white-space: pre-line">{{message}}</div>
    </div>
  </div>

  <div style="padding: 12px 18px 22px; border-top: 1px solid #E2E3DE; background: #F3F4F1">
    <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 14px; background: #0F7A4A; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"></path></svg>Envoyer sur WhatsApp</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { client: 0, tone: 0 };
  }
  renderVals() {
    const clients = [
      { name: 'M. Hounkpè', initials: 'MH', amount: '185 000', days: 23, inv: '214', first: 'M. Hounkpè' },
      { name: 'Boutique Sènan', initials: 'BS', amount: '200 000', days: 9, inv: '219', first: 'Mme Sènan' },
      { name: 'Hôtel du Lac', initials: 'HL', amount: '520 000', days: 0, inv: '226', first: 'Monsieur le gérant' },
      { name: 'Pharmacie Avocè', initials: 'PA', amount: '335 000', days: -6, inv: '231', first: 'Dr Avocè' }
    ];
    const toneNames = ['Courtois', 'Ferme', 'Dernier rappel'];
    const c = clients[this.state.client];
    const link = 'pilot.bj/p/' + c.inv;
    const msgs = [
      'Bonjour ' + c.first + ',\nPetit rappel pour la facture n° ' + c.inv + ' de ' + c.amount + ' FCFA.\nVous pouvez payer ici par Mobile Money : ' + link + '\nMerci et bonne journée.',
      'Bonjour ' + c.first + ',\nLa facture n° ' + c.inv + ' de ' + c.amount + ' FCFA reste impayée. Merci de la régler aujourd’hui via ce lien Mobile Money : ' + link,
      c.first + ',\nDernier rappel avant suspension de vos commandes : facture n° ' + c.inv + ', ' + c.amount + ' FCFA.\nPaiement : ' + link
    ];
    return {
      clients: clients.map((x, i) => {
        const on = this.state.client === i;
        const late = x.days > 0 ? x.days + ' jours de retard' : (x.days === 0 ? 'Échéance aujourd’hui' : 'Échéance dans ' + (-x.days) + ' jours');
        const lateColor = x.days > 0 ? '#8F3708' : '#565B66';
        return {
          ...x,
          late,
          checked: on ? 'true' : 'false',
          style: 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 10px; border-radius: 14px; border: 0; text-align: left; cursor: pointer; font-family: Manrope, sans-serif; color: #10131A; ' + (on ? 'background: #E7E6F7; box-shadow: inset 0 0 0 2px #2D2A9E;' : 'background: transparent;'),
          badge: 'width: 40px; height: 40px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; ' + (x.days > 0 ? 'background: #FFE8DA; color: #8F3708;' : 'background: #ECEDE9; color: #2A2D36;'),
          lateStyle: 'font-size: 13px; font-weight: 700; color: ' + lateColor,
          pick: () => this.setState({ client: i })
        };
      }),
      tones: toneNames.map((label, i) => {
        const on = this.state.tone === i;
        return {
          label,
          checked: on ? 'true' : 'false',
          style: 'min-height: 44px; border: 0; border-radius: 10px; font: 800 13px Manrope, sans-serif; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #10131A; box-shadow: 0 1px 3px rgba(16,19,26,0.15);' : 'background: transparent; color: #464B55;'),
          pick: () => this.setState({ tone: i })
        };
      }),
      message: msgs[this.state.tone]
    };
  }
}
</script>
</body>
</html>
