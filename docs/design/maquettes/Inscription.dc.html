<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PILOT — Inscription</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D2A9E}a:hover{color:#1E1B73}
input::placeholder{color:#8A8F99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3F4F1; font-family: Manrope, system-ui, sans-serif; color: #10131A; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #10131A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 13px; font-weight: 700; color: #2D2A9E; background: #E7E6F7; padding: 8px 12px; border-radius: 999px">14 jours gratuits</span>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -0.02em">Créons votre espace</h1>
    <p style="margin: 0; font-size: 15px; color: #565B66">Sans carte bancaire. 1 minute.</p>
  </div>

  <form style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px">
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 14px">
      <legend style="padding: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #565B66">Votre entreprise</legend>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Nom de l'entreprise
        <input type="text" placeholder="Ex. Ets Akpovi Distribution" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #D5D7D1; border-radius: 12px; background: #FFFFFF; font: 500 16px Manrope, sans-serif; color: #10131A">
      </label>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 700">Secteur d'activité</span>
        <div role="radiogroup" aria-label="Secteur d'activité" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{sectors}}" as="s" hint-placeholder-count="7">
            <button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
          </sc-for>
        </div>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 14px">
      <legend style="padding: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #565B66">Vous</legend>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Votre nom
        <input type="text" placeholder="Prénom et nom" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #D5D7D1; border-radius: 12px; background: #FFFFFF; font: 500 16px Manrope, sans-serif; color: #10131A">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Téléphone WhatsApp
        <span style="display: flex; height: 52px; border: 1.5px solid #D5D7D1; border-radius: 12px; background: #FFFFFF; overflow: hidden">
          <span style="display: flex; align-items: center; padding: 0 12px; background: #ECEDE9; font-weight: 700; font-size: 15px; color: #2A2D36">+229</span>
          <input type="tel" placeholder="01 00 00 00 00" style="flex: 1; min-width: 0; border: 0; padding: 0 12px; font: 500 16px Manrope, sans-serif; color: #10131A; background: transparent">
        </span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Mot de passe
        <input type="password" placeholder="8 caractères minimum" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #D5D7D1; border-radius: 12px; background: #FFFFFF; font: 500 16px Manrope, sans-serif; color: #10131A">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Email <span style="font-weight: 500; color: #565B66">(facultatif)</span>
        <input type="email" placeholder="vous@exemple.bj" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #D5D7D1; border-radius: 12px; background: #FFFFFF; font: 500 16px Manrope, sans-serif; color: #10131A">
      </label>
    </fieldset>
  </form>

  <div style="padding: 14px 20px 22px; background: #F3F4F1; border-top: 1px solid #E2E3DE; display: flex; flex-direction: column; gap: 12px">
    <a href="Accueil.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #2D2A9E; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none">Créer mon compte</a>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #565B66">Déjà inscrit ? <a href="Accueil.dc.html" style="font-weight: 700">Se connecter</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'Commerce / Boutique' };
  }
  renderVals() {
    const list = ['Commerce / Boutique', 'Restauration', 'Services', 'Quincaillerie / BTP', 'Agroalimentaire', 'Santé / Pharmacie', 'Autre'];
    const base = 'min-height: 44px; padding: 0 14px; border-radius: 999px; font: 700 14px Manrope, sans-serif; cursor: pointer; ';
    return {
      sectors: list.map((label) => {
        const on = this.state.picked === label;
        return {
          label,
          checked: on ? 'true' : 'false',
          style: base + (on ? 'background: #10131A; color: #FFFFFF; border: 1.5px solid #10131A;' : 'background: #FFFFFF; color: #10131A; border: 1.5px solid #D5D7D1;'),
          pick: () => this.setState({ picked: label })
        };
      })
    };
  }
}
</script>
</body>
</html>
